<style>
:root{
  --photo-bg:#0a0a0a;--photo-card:#1a1a1a;--photo-card-2:#232323;
  --photo-line:rgba(255,255,255,0.08);--photo-line-strong:rgba(255,255,255,0.16);
  --photo-text:#fff;--photo-mute:#9a9a9a;--photo-dim:#5e5e5e;
  --photo-red:#7D2530;--photo-red-deep:#5F1E27;--photo-red-soft:rgba(125, 37, 48,0.15);
  --gold:#D4A04B;--ok:#4FB07A;
  --f-ui:'Inter Tight',-apple-system,system-ui,sans-serif;
  --f-jp:'Zen Kaku Gothic New',-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;
  --f-display:'Bebas Neue','Inter Tight',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
:root[data-theme="light"]{
  --photo-bg:#f4f4f5;--photo-card:#fff;--photo-card-2:#fafafa;
  --photo-line:rgba(0,0,0,0.08);--photo-line-strong:rgba(0,0,0,0.16);
  --photo-text:#0a0a0a;--photo-mute:#5e5e5e;--photo-dim:#9a9a9a;
}
:root[data-theme="light"] html,:root[data-theme="light"] body{background:#e8e8ea}
:root[data-theme="light"] .tab{background:rgba(255,255,255,.95);border-top-color:rgba(0,0,0,0.08)}
/* ライトモード: 半透明黒系の bg を白系に置換 */

:root[data-theme="light"] .ex-card{background:rgba(255,255,255,.6) !important;border-color:rgba(0,0,0,.06) !important}
:root[data-theme="light"] .ex-stat{background:rgba(255,255,255,.7) !important;border-color:rgba(0,0,0,.06) !important}
:root[data-theme="light"] .ex-stats.sub .ex-stat{background:transparent !important;border-color:rgba(0,0,0,.03) !important}
:root[data-theme="light"] .ex-stats.sub .ex-stat .v{color:rgba(0,0,0,.55) !important}
:root[data-theme="light"] .chart-tabs{border-top-color:rgba(0,0,0,.06) !important}
:root[data-theme="light"] .chart-tab{color:rgba(0,0,0,.4) !important}
:root[data-theme="light"] .chart-tab.on{color:#0a0a0a !important}
:root[data-theme="light"] .ex-track{color:rgba(0,0,0,.5) !important}
:root[data-theme="light"] .ex-track .cur{color:#0a0a0a !important}
:root[data-theme="light"] .ex-stat .l{color:rgba(0,0,0,.45) !important}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#070708;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
button,a{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{font-family:var(--f-ui),var(--f-jp);color:var(--photo-text);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
.app{max-width:100%;margin:0 auto;min-height:100vh;background:var(--photo-bg);padding-top:env(safe-area-inset-top);padding-bottom:calc(90px + env(safe-area-inset-bottom));position:relative}

.head{padding:calc(20px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px}
.head .back{width:34px;height:34px;border-radius:50%;background:rgba(26,26,26,.5);border:1px solid var(--photo-line);display:flex;align-items:center;justify-content:center;color:var(--photo-text);font-size:18px;text-decoration:none;flex-shrink:0}
.head h1{font-family:var(--f-jp);font-size:24px;font-weight:900;letter-spacing:-.01em;flex:1}
.head h1 small{display:block;font-family:var(--f-display);font-size:10px;color:var(--photo-mute);letter-spacing:.18em;margin-top:2px;font-weight:400}

.seg-period{margin:6px 16px 14px;background:rgba(26,26,26,.4);border:1px solid rgba(255,255,255,.04);border-radius:50px;padding:4px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.seg-period button{background:transparent;border:0;color:var(--photo-mute);font-family:var(--f-jp);font-size:12px;font-weight:700;padding:9px 0;border-radius:50px;cursor:pointer;letter-spacing:.04em;transition:.15s}
.seg-period button.on{background:var(--photo-red);color:var(--photo-text);box-shadow:0 2px 8px rgba(125, 37, 48,.3)}
:root[data-theme="light"] .seg-period{background:rgba(255,255,255,.6) !important;border-color:rgba(0,0,0,.06) !important}

.summary{margin:6px 16px 20px;background:linear-gradient(135deg,rgba(26,10,12,.4),rgba(26,26,26,.2) 70%);border:1px solid rgba(125, 37, 48,.08);border-radius:14px;padding:18px 18px;display:flex;justify-content:space-between;align-items:baseline}
.summary .l{font-family:var(--f-display);font-size:10px;color:var(--photo-mute);letter-spacing:.2em;margin-bottom:4px}
.summary .v{font-family:var(--f-mono);font-size:24px;font-weight:600;color:var(--photo-text);letter-spacing:-.02em;line-height:1}
.summary .v small{font-family:var(--f-display);font-size:10px;color:var(--photo-mute);letter-spacing:.18em;margin-left:3px;font-weight:400}
.summary .s{text-align:right}
.summary .s .v{font-size:16px}

.section{padding:0 16px;margin-bottom:22px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding:0 2px}
.section-head h2{font-family:var(--f-jp);font-size:15px;font-weight:900;letter-spacing:-.01em}
.section-head h2 small{font-family:var(--f-display);font-size:9px;color:var(--photo-dim);letter-spacing:.18em;margin-left:8px;font-weight:400}

.ex-list{display:flex;flex-direction:column;gap:10px}
.ex-card{background:rgba(26,26,26,.35);border:1px solid rgba(255,255,255,.04);border-radius:12px;padding:14px 16px}
.ex-name{font-family:var(--f-jp);font-size:14px;font-weight:700;color:var(--photo-text);margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ex-name .pr-badge{font-family:var(--f-display);font-size:9px;letter-spacing:.18em;color:var(--gold);background:rgba(212,160,75,.08);border:1px solid rgba(212,160,75,.25);padding:2px 8px;border-radius:50px;font-weight:500}
.ex-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.ex-stat{background:rgba(10,10,10,.35);border:1px solid rgba(255,255,255,.03);border-radius:8px;padding:11px 6px;text-align:center}
.ex-stat .l{font-family:var(--f-display);font-size:8px;color:var(--photo-dim);letter-spacing:.2em;margin-bottom:4px;font-weight:400;opacity:.85}
.ex-stat .v{font-family:var(--f-mono);font-size:14px;font-weight:500;color:var(--photo-text);letter-spacing:-.01em;line-height:1}
.ex-stat .v small{font-family:var(--f-display);font-size:8px;color:var(--photo-mute);letter-spacing:.1em;margin-left:1px;font-weight:400}
.ex-stat.best .v{color:var(--gold)}
.ex-stat.delta.up .v{color:var(--ok)}
.ex-stat.delta .v{color:var(--photo-mute)}
/* 2行目: 積み上げ系 (重量系より控えめに) */
.ex-stats.sub{margin-top:0;margin-bottom:12px;gap:8px}
.ex-stats.sub .ex-stat{background:transparent;border-color:rgba(255,255,255,.02);padding:8px 6px}
.ex-stats.sub .ex-stat .l{opacity:.6}
.ex-stats.sub .ex-stat .v{font-size:12px;font-weight:400;color:var(--photo-mute)}
/* ホバー / タッチ tooltip */
.ex-chart-wrap{position:relative;touch-action:pan-y}
.ex-chart-tip{position:absolute;background:rgba(10,10,10,.92);color:#fff;font-family:var(--f-mono);font-size:10px;padding:5px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);z-index:5;letter-spacing:-.01em;opacity:0;transition:opacity .12s;border:1px solid rgba(255,255,255,.08)}
.ex-chart-tip.on{opacity:1}
.ex-chart-tip small{font-family:var(--f-display);font-size:8px;color:rgba(255,255,255,.6);letter-spacing:.12em;margin-left:4px;font-weight:400}
:root[data-theme="light"] .ex-chart-tip{background:rgba(255,255,255,.96) !important;color:#0a0a0a !important;border-color:rgba(0,0,0,.08) !important;box-shadow:0 2px 8px rgba(0,0,0,.08)}
:root[data-theme="light"] .ex-chart-tip small{color:rgba(0,0,0,.5) !important}
.chart-tabs{display:flex;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.04);gap:2px}
.chart-tab{background:transparent;border:0;color:var(--photo-dim);font-family:var(--f-display);font-size:9px;letter-spacing:.2em;padding:5px 10px 6px;cursor:pointer;font-weight:400;border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.chart-tab.on{color:var(--photo-text);border-bottom-color:var(--photo-red)}
.ex-chart{width:100%;height:70px;display:block;margin-top:6px}
.ex-track{font-family:var(--f-mono);font-size:11px;color:var(--photo-mute);letter-spacing:-.01em;margin-top:8px;line-height:1.6;word-break:break-all}
.ex-track .arrow{color:var(--photo-dim);margin:0 5px;font-size:10px}
.ex-track .cur{color:var(--photo-text);font-weight:600}
.ex-track .best{color:var(--gold);font-weight:600}
.ex-track-empty{font-family:var(--f-jp);font-size:11px;color:var(--photo-dim);padding-top:8px;border-top:1px solid rgba(255,255,255,.04);text-align:center}

.empty{text-align:center;color:var(--photo-dim);padding:32px 16px;font-family:var(--f-jp);font-size:13px}
.loading{text-align:center;padding:40px 20px;color:var(--photo-mute);font-family:var(--f-display);font-size:11px;letter-spacing:.18em}

.tab{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:rgba(10,10,10,.95);backdrop-filter:blur(12px);border-top:1px solid var(--photo-line);padding:10px 8px calc(28px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;z-index:30}
.tab a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--photo-dim);text-decoration:none;letter-spacing:.04em;cursor:pointer;font-family:var(--f-jp);font-weight:700;padding:4px 0}
.tab a.on{color:var(--photo-red)}
.tab a .ic{font-size:18px;line-height:1;font-family:var(--f-ui)}

@media (orientation:landscape){.app{max-width:100%}.tab{max-width:100%}}
</style>

<div class="app">

    <button data-p="30">月</button>

  </div>

  <div class="summary" id="summary" style="display:none">
    <div>
      <div class="l">総ボリューム</div>
      <div class="v"><span id="totalVol">0</span><small>kg</small></div>
    </div>
    <div class="s">
      <div class="l">セット数</div>
      <div class="v"><span id="totalSets">0</span></div>
    </div>
  </div>

  <div id="loading" class="loading">データ読込中…</div>

  <div id="content" style="display:none">
    <div class="section">
      <div class="section-head">
        <h2>種目の軌跡<small>EXERCISE TRACE</small></h2>
      </div>
      <div class="ex-list" id="exList"></div>
    </div>

  <a href="home.html"><span class="ic">⌂</span>ホーム</a>

  <a href="pattern-i.html#chest"><span class="ic">☰</span>メニュー</a>

  <a href="settings.html"><span class="ic">⚙</span>設定</a>

<script>
const API = 'https://kinntore-api.33322666666mm.workers.dev';
const TAG_LABEL = { chest:'胸', shoulder:'肩', back:'背中', arm:'腕', leg:'脚', calf:'ふくらはぎ', abs:'腹', hip:'お尻' };
const TAG_EN = { chest:'CHEST', shoulder:'SHOULDERS', back:'BACK', arm:'ARMS', leg:'LEGS', calf:'CALVES', abs:'ABS', hip:'GLUTES' };
const $ = id => document.getElementById(id);
const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const params = new URLSearchParams(location.search);
const part = params.get('part') || 'chest';
let PERIOD_DAYS = Math.max(7, Math.min(365, parseInt(params.get('period') || '90', 10) || 90));

$('partName').firstChild.textContent = TAG_LABEL[part] || '部位';
$('partEn').textContent = TAG_EN[part] || 'PART';

// 戻るリンクに period を引き継ぐ
$('backLink').href = `progress.html?p=${PERIOD_DAYS}`;

// 期間タブ初期化
document.querySelectorAll('#segPeriod button').forEach(b => {
  b.classList.toggle('on', +b.dataset.p === PERIOD_DAYS);
  b.addEventListener('click', () => {
    const p = +b.dataset.p;
    if (p === PERIOD_DAYS) return;
    // URL 書き換え + リロード (シンプル)
    const url = new URL(location.href);
    url.searchParams.set('period', p);
    location.href = url.toString();
  });
});

async function fetchDay(d) {
  try { const r = await fetch(API+'/api/sets?day='+d); if(!r.ok)return []; return (await r.json()).sets||[]; } catch{return []}
}

let allData = [];

async function load() {
  $('loading').style.display = '';
  $('content').style.display = 'none';
  const today = new Date(); today.setHours(0,0,0,0);
  const days = []; for (let i=0;i<PERIOD_DAYS;i++){const d=new Date(today);d.setDate(d.getDate()-i);days.push(fmt(d))}
  // 90日分の prefetch は流用、足りない分は逐次取得
  let pre = null;
  try {
    const c = JSON.parse(sessionStorage.getItem('kinntore_prefetch_90d')||'null');
    if (c && (Date.now() - c.ts) < 5*60*1000 && Array.isArray(c.data)) pre = c.data;
  } catch {}
  if (pre) {
    const want = new Set(days);
    allData = pre.filter(d => want.has(d.day));
  }
  // 不足日 (90日より前) は遅延取得
  const have = new Set(allData.map(d => d.day));
  const missing = days.filter(d => !have.has(d));
  if (missing.length) {
    const chunks=[]; for(let i=0;i<missing.length;i+=5) chunks.push(missing.slice(i,i+5));
    for (const c of chunks) {
      const r = await Promise.all(c.map(d => fetchDay(d).then(sets=>({day:d,sets}))));
      allData.push(...r);
    }
  }
  render();
  $('loading').style.display = 'none';
  $('summary').style.display = '';
  $('content').style.display = '';
}

function render() {
  // この部位だけ抽出
  const ex = {}; // name → [{day, weight, reps, vol}, ...]
  let totalVol = 0, totalSets = 0;
  for (const d of allData) {
    for (const s of d.sets) {
      if (s.tag !== part) continue;
      const w = +s.weight||0, r = +s.reps||0;
      if (!ex[s.exercise_name]) ex[s.exercise_name] = [];
      ex[s.exercise_name].push({ day: d.day, weight: w, reps: r, vol: w*r });
      totalVol += w*r;
      totalSets++;
    }
  }
  $('totalVol').textContent = totalVol.toLocaleString();
  $('totalSets').textContent = totalSets.toLocaleString();

  const names = Object.keys(ex).sort();
  if (!names.length) {
    $('exList').innerHTML = `<div class="empty">${TAG_LABEL[part]}の記録はまだありません</div>`;
    return;
  }
  // 種目ごとカード
  const cards = names.map(name => {
    const sets = ex[name].sort((a,b)=>a.day.localeCompare(b.day));
    // 日ごと最大重量
    const byDay = {};
    for (const s of sets) {
      if (!byDay[s.day] || byDay[s.day] < s.weight) byDay[s.day] = s.weight;
    }
    const days = Object.keys(byDay).sort();
    const weights = days.map(d => byDay[d]);
    const first = weights[0] || 0;
    const cur = weights[weights.length-1] || 0;
    const best = Math.max(...weights);
    const delta = cur - first;
    // 積み上げ系: 総ボリューム / 1日最高ボリューム / 累計セット数
    let exTotalVol = 0;
    const volByDay = {};
    for (const s of sets) {
      const v = (s.weight || 0) * (s.reps || 0);
      exTotalVol += v;
      volByDay[s.day] = (volByDay[s.day] || 0) + v;
    }
    const exVolBest = Math.max(0, ...Object.values(volByDay));
    const exSetCount = sets.length;
    // 軌跡: 重量が変化した時点だけを抜き出す (連続重複は省く)
    const trace = [];
    let prev = null;
    for (const w of weights) {
      if (prev === null || w !== prev) { trace.push(w); prev = w; }
    }
    // 表示は最大8段階 (長くなりすぎないよう間引き)
    let displayTrace = trace;
    if (trace.length > 8) {
      const step = (trace.length - 1) / 7;
      displayTrace = [];
      for (let i = 0; i < 7; i++) displayTrace.push(trace[Math.round(i * step)]);
      displayTrace.push(trace[trace.length-1]);
    }
    // PR バッジ: 現在が BEST と同じなら PR
    const isPR = cur === best && weights.length > 1;
    const traceHtml = displayTrace.length > 1
      ? displayTrace.map((w,i) => {
          const isBest = w === best;
          const isCur = i === displayTrace.length - 1;
          const cls = isBest && isCur ? 'cur best' : isBest ? 'best' : isCur ? 'cur' : '';
          return `<span class="${cls}">${w}</span>` + (i < displayTrace.length - 1 ? '<span class="arrow">→</span>' : '');
        }).join('')
      : '<span class="ex-track-empty">1回のみ記録</span>';
    // グラフ生成: VOLUME と WEIGHT の2種類
    function buildChartSvg(values, mode, hidden, opts) {
      opts = opts || {};
      if (values.length < 2) return '';
      const max = Math.max(...values), min = Math.min(...values);
      const range = Math.max(0.5, max - min);
      const pts = values.map((v,i) => ({
        x: (i/(values.length-1))*340 + 10,
        y: 60 - ((v-min)/range)*50
      }));
      let pathD = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i-1)];
        const p1 = pts[i];
        const p2 = pts[i+1];
        const p3 = pts[Math.min(pts.length-1, i+2)];
        const c1x = p1.x + (p2.x - p0.x) / 6;
        const c1y = p1.y + (p2.y - p0.y) / 6;
        const c2x = p2.x - (p3.x - p1.x) / 6;
        const c2y = p2.y - (p3.y - p1.y) / 6;
        pathD += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
      }
      const areaD = pathD + ` L ${pts[pts.length-1].x.toFixed(1)},70 L 10,70 Z`;
      // BEST と CURRENT を点マーク
      const valMax = Math.max(...values);
      const bestIdx = values.indexOf(valMax);
      const curIdx = values.length - 1;
      let dots = '';
      if (bestIdx !== curIdx) {
        dots += `<circle cx="${pts[bestIdx].x.toFixed(1)}" cy="${pts[bestIdx].y.toFixed(1)}" r="2.2" fill="#D4A04B"/>`;
      }
      const curFill = values[curIdx] === valMax ? '#D4A04B' : '#7D2530';
      dots += `<circle cx="${pts[curIdx].x.toFixed(1)}" cy="${pts[curIdx].y.toFixed(1)}" r="2.5" fill="${curFill}"/>`;
      const gid = 'g-' + Math.random().toString(36).slice(2,8);
      const valuesAttr = JSON.stringify(values).replace(/"/g,'&quot;');
      const daysAttr = JSON.stringify(opts.days || []).replace(/"/g,'&quot;');
      return `<svg class="ex-chart" data-mode="${mode}" data-values="${valuesAttr}" data-days="${daysAttr}" viewBox="0 0 360 70" preserveAspectRatio="none"${hidden ? ' style="display:none"' : ''}>
        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7D2530" stop-opacity=".12"/><stop offset="1" stop-color="#7D2530" stop-opacity="0"/></linearGradient></defs>
        <path d="${areaD}" fill="url(#${gid})"/>
        <path d="${pathD}" fill="none" stroke="#7D2530" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" opacity=".6"/>
        ${dots}
      </svg>`;
    }
    // 日ごとのボリューム配列
    const volDays = Object.keys(volByDay).sort();
    const dailyVols = volDays.map(d => volByDay[d]);
    // weights は days と対応 (既に sorted)
    let chartSvg = '';
    if (weights.length >= 2 || dailyVols.length >= 2) {
      const volSvg = buildChartSvg(dailyVols, 'volume', false, {days: volDays});
      const wSvg = buildChartSvg(weights, 'weight', true, {days: days});
      chartSvg = `<div class="chart-tabs">
        <button class="chart-tab on" data-mode="volume">VOLUME</button>
        <button class="chart-tab" data-mode="weight">WEIGHT</button>
      </div><div class="ex-chart-wrap">${volSvg}${wSvg}<div class="ex-chart-tip"></div></div>`;
    }
    return `<div class="ex-card">
      <div class="ex-name">
        <span>${name}</span>
        ${isPR ? '<span class="pr-badge">PR</span>' : ''}
      </div>
      <div class="ex-stats">
        <div class="ex-stat best"><div class="l">MAX</div><div class="v">${best}<small>kg</small></div></div>
        <div class="ex-stat"><div class="l">CURRENT</div><div class="v">${cur}<small>kg</small></div></div>
        <div class="ex-stat delta ${delta>0?'up':''}"><div class="l">FROM FIRST</div><div class="v">${delta>=0?'+':''}${delta.toFixed(1)}<small>kg</small></div></div>
      </div>
      <div class="ex-stats sub">
        <div class="ex-stat"><div class="l">VOLUME</div><div class="v">${exTotalVol.toLocaleString()}<small>kg</small></div></div>
        <div class="ex-stat"><div class="l">VOL BEST</div><div class="v">${exVolBest.toLocaleString()}<small>kg</small></div></div>
        <div class="ex-stat"><div class="l">SETS</div><div class="v">${exSetCount}</div></div>
      </div>
      ${chartSvg}
      <div class="ex-track">${traceHtml}</div>
    </div>`;
  }).join('');
  $('exList').innerHTML = cards;
  // タブ切替: 同じ ex-card 内の svg を切り替え
  document.querySelectorAll('.ex-card').forEach(card => {
    const tabs = card.querySelectorAll('.chart-tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const mode = tab.dataset.mode;
        tabs.forEach(t => t.classList.toggle('on', t === tab));
        card.querySelectorAll('.ex-chart').forEach(svg => {
          svg.style.display = svg.dataset.mode === mode ? 'block' : 'none';
        });
      });
    });
  });
  // チャートホバー/タッチ tooltip
  document.querySelectorAll('.ex-chart-wrap').forEach(attachChartHover);
}

function attachChartHover(wrap) {
  const tip = wrap.querySelector('.ex-chart-tip');
  if (!tip) return;
  const NS = 'http://www.w3.org/2000/svg';
  function getActiveSvg() {
    return Array.from(wrap.querySelectorAll('.ex-chart')).find(s => s.style.display !== 'none');
  }
  function ensureCursor(svg) {
    let line = svg.querySelector('.ex-chart-cursor');
    let marker = svg.querySelector('.ex-chart-marker');
    if (!line) {
      line = document.createElementNS(NS,'line');
      line.setAttribute('class','ex-chart-cursor');
      line.setAttribute('stroke','rgba(125, 37, 48,.45)');
      line.setAttribute('stroke-width','0.8');
      line.setAttribute('y1','0');
      line.setAttribute('y2','70');
      svg.appendChild(line);
    }
    if (!marker) {
      marker = document.createElementNS(NS,'circle');
      marker.setAttribute('class','ex-chart-marker');
      marker.setAttribute('r','3');
      marker.setAttribute('fill','#fff');
      marker.setAttribute('stroke','#7D2530');
      marker.setAttribute('stroke-width','1.2');
      svg.appendChild(marker);
    }
    return { line, marker };
  }
  function hideAll() {
    tip.classList.remove('on');
    wrap.querySelectorAll('.ex-chart-cursor,.ex-chart-marker').forEach(el => el.style.display = 'none');
  }
  function fmtDay(d) {
    if (!d) return '';
    const parts = d.split('-');
    return parts.length >= 3 ? `${+parts[1]}/${+parts[2]}` : d;
  }
  function onMove(e) {
    const svg = getActiveSvg();
    if (!svg) return;
    const r = svg.getBoundingClientRect();
    const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0]?.clientX);
    if (clientX == null) return;
    let xPct = (clientX - r.left) / r.width;
    if (xPct < 0) xPct = 0; if (xPct > 1) xPct = 1;
    let values, days;
    try {
      values = JSON.parse(svg.dataset.values || '[]');
      days = JSON.parse(svg.dataset.days || '[]');
    } catch (_) { return; }
    if (values.length < 2) return;
    const idx = Math.max(0, Math.min(values.length-1, Math.round(xPct * (values.length - 1))));
    const v = values[idx];
    const day = days[idx];
    // chart coords (matches buildChartSvg)
    const xCoord = (idx/(values.length-1))*340 + 10;
    const max = Math.max(...values), min = Math.min(...values);
    const range = Math.max(0.5, max - min);
    const yCoord = 60 - ((v-min)/range)*50;
    const { line, marker } = ensureCursor(svg);
    line.setAttribute('x1', xCoord);
    line.setAttribute('x2', xCoord);
    marker.setAttribute('cx', xCoord);
    marker.setAttribute('cy', yCoord);
    line.style.display = '';
    marker.style.display = '';
    // tooltip text
    const mode = svg.dataset.mode;
    const unit = 'kg';
    tip.innerHTML = `${v.toLocaleString()}${unit}<small>${fmtDay(day)}</small>`;
    tip.classList.add('on');
    // position: tooltip はグラフ上端の少し上に固定 (指/カーソルに被らない)
    const wrapRect = wrap.getBoundingClientRect();
    const tipX = (r.left - wrapRect.left) + xPct * r.width;
    const tipY = (r.top - wrapRect.top) - 6;
    tip.style.left = `${tipX}px`;
    tip.style.top = `${tipY}px`;
  }
  wrap.addEventListener('pointermove', onMove);
  wrap.addEventListener('pointerdown', onMove);
  wrap.addEventListener('pointerleave', hideAll);
  wrap.addEventListener('pointerup', hideAll);
  wrap.addEventListener('pointercancel', hideAll);
}

load();
</script>
</body></html>
